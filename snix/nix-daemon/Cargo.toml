[package]
name = "nix-daemon"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
nix-compat = { path = "../nix-compat", features = ["daemon"] }
snix-castore.path = "../castore"
snix-store.path = "../store"
snix-build-glue.path = "../build-glue"
